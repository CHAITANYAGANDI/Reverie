# Reverie on one Oracle Cloud Ampere A1 (ARM64) host.
#
# Both compute services move here from Render. Everything stateful stays where
# it is: Neon holds the database, Confluent Cloud the broker, Cloudflare R2 the
# recordings, Vercel the frontend. These containers own no user data, which is
# what makes the VM disposable -- a replacement is this repository, this file,
# a populated .env, and a DNS record.
#
#   Internet -> Caddy (80/443, TLS) -> reverie-backend:8080
#                                             |
#                                             +-> reverie-ai:8000  (private)
#
# Run from this directory:  docker compose up -d
# See README.md for the full first-boot sequence.

name: reverie

x-logging: &logging
  driver: json-file
  options:
    # The boot volume is finite and nothing here ships logs off-host. 10 MB x 3
    # per service is hours of INFO at this traffic level and cannot fill 50 GB.
    max-size: "10m"
    max-file: "3"

services:
  # --------------------------------------------------------------- caddy ---
  # The only service with a published port. Terminates TLS, obtains and renews
  # the certificate automatically, and proxies to Spring.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # QUIC/HTTP3. Harmless if the security list does not open UDP; Caddy
      # falls back to TCP.
      - "443:443/udp"
    # The two names the Caddyfile reads, and nothing else -- no database, no
    # broker, no provider key. A reverse proxy that is compromised should yield
    # the certificate it already serves, not the estate behind it.
    environment:
      # The hostname Caddy obtains a certificate for. It must already resolve
      # to this VM's public IP or the ACME challenge fails. See README "DNS".
      # `:?` rather than a bare name: without it Caddy starts and serves a site
      # called "" , which looks like a TLS failure and is not one.
      - BACKEND_HOSTNAME=${BACKEND_HOSTNAME:?set BACKEND_HOSTNAME in .env}
      # Where Let's Encrypt sends expiry warnings. The Caddyfile has always read
      # {$ACME_EMAIL} but this service had no env_file and no mapping, so the
      # value the operator set in .env never actually reached Caddy. Passed now.
      # Optional to Let's Encrypt, so a bare name is right: unset means unset
      # rather than an empty address.
      - ACME_EMAIL
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Losing these is not fatal, but
      # it re-issues on every restart and Let's Encrypt rate-limits that.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - reverie-backend
    logging: *logging

  # ------------------------------------------------------ reverie-backend ---
  reverie-backend:
    build:
      context: ../../backend-spring
    container_name: reverie-backend
    restart: unless-stopped
    # NO `ports:`. Reachable only from `edge` (Caddy) and `internal` (the
    # worker). Publishing 8080 would put Spring on the internet beside Caddy
    # rather than behind it, and the Oracle security list would not stop it --
    # Docker writes its own iptables rules.
    expose:
      - "8080"
    # NO `env_file:`. The operator keeps one .env, but handing all of it to both
    # containers would give the worker Flyway's password, Clerk's secret key and
    # the free-tier HMAC, none of which it has any use for. Each service lists
    # what it reads and gets nothing else.
    #
    # Bare names rather than `KEY: ${KEY}`, and the difference matters: Compose
    # resolves a bare name from .env, and when it is absent it leaves the
    # variable UNSET rather than setting it to "". An empty string is not the
    # same as absent -- it would override the default in application.yml, so
    # an unset S3_REGION would become "" instead of falling back.
    environment:
      # --- Spring runtime -------------------------------------------------
      - SPRING_PROFILES_ACTIVE
      - APP_FRONTEND_URL              # CORS + STOMP allowed origin
      - APP_PUBLIC_URL
      # --- Neon: runtime role, system role, and Flyway's owner ------------
      - SPRING_DATASOURCE_URL
      - SPRING_DATASOURCE_USERNAME
      - SPRING_DATASOURCE_PASSWORD
      - REVERIE_DATASOURCE_SYSTEM_USERNAME
      - REVERIE_DATASOURCE_SYSTEM_PASSWORD
      - FLYWAY_URL
      - FLYWAY_USER
      - FLYWAY_PASSWORD
      # --- Confluent: Spring's own names, JAAS rather than user/password ---
      - SPRING_KAFKA_BOOTSTRAP_SERVERS
      - KAFKA_SECURITY_PROTOCOL
      - KAFKA_SASL_MECHANISM
      - KAFKA_SASL_JAAS_CONFIG
      # --- Clerk + identity ------------------------------------------------
      - REVERIE_AUTH_MODE
      - CLERK_ISSUER
      - CLERK_JWKS_URL
      - CLERK_SECRET_KEY
      - FREE_TIER_IDENTITY_HMAC_SECRET
      # --- The shared secret on /internal/**, read by both services ---------
      - REVERIE_INTERNAL_TOKEN
      # --- R2 ---------------------------------------------------------------
      - S3_ENDPOINT
      - S3_PUBLIC_ENDPOINT
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_BUCKET
      - S3_REGION
      # --- Resend ------------------------------------------------------------
      - RESEND_API_KEY
      - REVERIE_MAIL_FROM
      - REVERIE_MAIL_SELF_ONLY
      - REVERIE_MAIL_SELF_USER_ID
      # --- Sentry ------------------------------------------------------------
      - SENTRY_ENVIRONMENT
      # Both services read a variable called SENTRY_DSN and they are different
      # Sentry projects -- three projects keep three services' alerts apart
      # (see com.reverie.observability). One shared .env cannot hold two values
      # under one name, so the file names them apart and this maps them back.
      # Interpolation is unavoidable here because the name changes; blank is
      # the documented "monitoring off" state, so "" is harmless.
      - SENTRY_DSN=${SENTRY_DSN_BACKEND:-}
      # --- Set here, not by the operator --------------------------------------
      # Docker DNS on the private network. Spring never leaves the host to
      # reach the worker, so plain HTTP here is deliberate, not an oversight.
      - AI_SERVICE_URL=http://reverie-ai:8000
      # Oracle's own JVM sizing, deliberately NOT Render's percentages. A
      # percentage tuned for a 512 MB box is the wrong shape on a 2 GB one --
      # see README "JVM sizing" for the measurements behind these numbers.
      #
      # No MaxMetaspaceSize. Metaspace measured flat at ~133 MiB across a full
      # load suite and, in the earlier Render work, across a 35-minute soak; a
      # cap with no measured need only converts a container that has 2.4 GB
      # spare into a java.lang.OutOfMemoryError.
      - JAVA_TOOL_OPTIONS=${BACKEND_JAVA_OPTS:--Xms512m -Xmx1024m}
    # 2 GB. Measured settled 581 MB and peak 589 MB under the full load suite,
    # so this is ~3.5x the observed peak. The number that actually has to fit is
    # the worst case rather than the average: -Xmx1024m plus the JVM floor this
    # application carries -- ~132 MB metaspace, ~17 MB class space, ~71 MB code
    # cache, ~110 MB thread stacks and JIT arenas -- is about 1.35 GB, which
    # leaves roughly 700 MB spare even if the heap ever fills.
    mem_limit: 2g
    # Swap disabled. A container that needs swap has a problem worth failing on
    # rather than hiding behind disk latency.
    memswap_limit: 2g
    cpus: 1.0
    healthcheck:
      # busybox wget, already present in the Alpine JRE image. Nothing is
      # installed to make this work.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      # Spring takes ~70 s to start on Render. The grace period is generous so
      # a slow boot is not read as a failure and restarted into a loop.
      start_period: 180s
      retries: 3
    networks:
      - edge
      - internal
    logging: *logging

  # ----------------------------------------------------------- reverie-ai ---
  # Never reachable from the internet. It sits on `internal` only, and Caddy is
  # not attached to that network, so there is no route to it even by mistake.
  # Outbound still works -- a bridge network NATs egress -- which is what lets
  # it reach Confluent, R2, Neon and the providers.
  reverie-ai:
    build:
      context: ../../ai-service
    container_name: reverie-ai
    restart: unless-stopped
    expose:
      - "8000"
    # NO `env_file:` -- see the note on the backend. Every name below is a field
    # on the worker's own pydantic Settings (ai-service/app/config.py); nothing
    # else it is handed would even be read, so handing it more would only widen
    # what a compromise of this container exposes.
    #
    # Nothing about Flyway, Clerk, Resend, the free-tier HMAC or either Spring
    # datasource appears here. The worker reaches Neon as the unprivileged role
    # through its own PG_* settings, and posts back to Spring with the internal
    # token -- it has no use for the schema owner's password.
    environment:
      # --- Confluent: the worker's own names, user/password rather than JAAS ---
      - KAFKA_BOOTSTRAP_SERVERS
      - KAFKA_SECURITY_PROTOCOL
      - KAFKA_SASL_MECHANISM
      - KAFKA_SASL_USERNAME
      - KAFKA_SASL_PASSWORD
      # --- The shared secret on /internal/**, read by both services ---------
      - REVERIE_INTERNAL_TOKEN
      # --- R2 ---------------------------------------------------------------
      - S3_ENDPOINT
      - S3_PUBLIC_ENDPOINT
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
      - S3_BUCKET
      - S3_REGION
      # --- Neon, for RAG. The unprivileged role, so the policies bind ---------
      - PG_HOST
      - PG_PORT
      - PG_DATABASE
      - PG_USER
      - PG_PASSWORD
      - PG_SSLMODE
      # --- Providers ----------------------------------------------------------
      - AI_PROVIDER
      - OPENAI_API_KEY
      - OPENAI_TRANSCRIBE_MODEL
      - OPENAI_CHAT_MODEL
      - OPENAI_EXTRACTION_MODEL
      - OPENAI_EMBED_MODEL
      - TRANSCRIPTION_PROVIDER
      - ASSEMBLYAI_API_KEY
      - ASSEMBLYAI_MODEL
      - ASSEMBLYAI_FALLBACK_MODEL
      - ASSEMBLYAI_LANGUAGE
      # --- Sentry -------------------------------------------------------------
      - REVERIE_ENV
      # The ai-service's own Sentry project, not the backend's. See the note
      # on the backend service above.
      - SENTRY_DSN=${SENTRY_DSN_AI:-}
      # --- Set here, not by the operator ---------------------------------------
      # Where the worker posts transcripts and status back to. Docker DNS
      # again; REVERIE_INTERNAL_TOKEN is what authorises it, not the network.
      - SPRING_CALLBACK_URL=http://reverie-backend:8080
    # 1 GB. Measured 98 MB idle and 143 MB peak while encoding a 30-minute
    # recording to MP3, so this is ~7x the observed peak. The headroom is for
    # `ffmpeg`, which is the only thing here that allocates unpredictably, and
    # for more than one export happening at once.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    healthcheck:
      # python, not curl: the slim image has no curl, and adding one to satisfy
      # a healthcheck would be the wrong trade. /health is the app's own route
      # (app/main.py), not something invented for this file.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - internal
    logging: *logging

networks:
  # Caddy <-> Spring.
  edge:
    driver: bridge
  # Spring <-> worker. Deliberately NOT `internal: true`: the worker needs
  # egress to Confluent, R2, Neon and the transcription providers, and this is
  # the only network it is on. Isolation here comes from Caddy being absent and
  # from nothing publishing a port, not from blocking outbound traffic.
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

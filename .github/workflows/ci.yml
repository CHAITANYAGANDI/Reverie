# What has to pass before anything reaches a deployment branch.
#
# Until this existed, nothing ran the backend or ai-service suites before a
# deploy -- render.yaml shipped whatever was on the branch, and the backend's
# own Dockerfile packages with `-DskipTests`, which is correct in an image build
# and only correct if something else ran them first. This is that something.
#
# Three suites, one per service, in parallel: they share no state and a Java
# compile has no business delaying a Vitest run. `migrations` is separate
# because it answers a different question -- not "does the code pass" but "can
# this schema be built from nothing", which is what a new environment does and
# what no unit test exercises.
#
# Nothing here contacts Clerk, OpenAI, AssemblyAI, Resend, R2 or Confluent. The
# suites are built to run offline (the ai-service pins AI_PROVIDER=mock, the
# Spring tests mock every client), and a CI run that needed live credentials
# would be a CI run that cannot be trusted to fail for the right reason.

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A force-push or a quick second push should cancel the run it replaced rather
# than queue behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, never `npm install`: it installs the lockfile exactly and
      # fails if package.json and the lock have drifted, which is the whole
      # point of having a lock in the pipeline.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Last, because it is the slowest and the least specific: a failure here
      # after three green steps is almost always a build-time-only problem.
      - name: Production build
        run: npm run build
        env:
          # Build-time public values. Placeholders, because `next build` reads
          # NEXT_PUBLIC_* at build time and fails without them -- and because a
          # build that needed the real Clerk key would mean CI could not run on
          # a fork.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2ktcGxhY2Vob2xkZXIk
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws

  backend:
    name: Spring
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # The pom's <java.version>. 17 cannot compile it.
          java-version: '21'
          distribution: temurin
          cache: maven

      # `verify`, not `test`: it runs the same suite and then packages, so a
      # change that passes its tests and breaks the jar fails here rather than
      # in the image build.
      - run: mvn -B --no-transfer-progress verify

  ai-service:
    name: AI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # matches ai-service/Dockerfile
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      # The lock, with hashes, not the ranges in pyproject. Two builds of the
      # same commit two months apart used to get different versions of the
      # OpenAI SDK, Kafka client and psycopg; `--require-hashes` is implied by
      # a file that carries them, so a tampered or substituted artifact fails
      # the install rather than shipping.
      - run: pip install --require-hashes -r requirements-dev.txt

      - run: pytest -q
        env:
          # The suite's own defaults, stated rather than inherited, so a change
          # to the shipped defaults cannot silently start calling a provider.
          AI_PROVIDER: mock
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

  migrations:
    name: Migrations from empty
    runs-on: ubuntu-latest
    # A real PostgreSQL, because that is what the migrations are written
    # against: H2 accepts a different dialect and would pass on SQL that Neon
    # refuses. pgvector, because the RAG tables need the extension.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: reverie
          POSTGRES_PASSWORD: reverie
          POSTGRES_DB: reverie
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reverie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The repository already has a switch for this, and it is better than a
      # bare `flyway:migrate` would be: ApplicationContextSmokeTest starts the
      # real application against a real PostgreSQL, so Flyway runs every
      # migration in order against an empty database *and* Hibernate then has to
      # agree with the schema that came out. A migration that applies cleanly
      # and leaves a column Hibernate cannot map fails here.
      #
      # It skips itself without the variable, which is why the whole suite can
      # stay green on a laptop with no database and still be checked here.
      #
      # Connects as the owner, because Flyway needs to. OutboxClaimConcurrencyTest
      # is the one that exercises the unprivileged runtime role, and it needs
      # that role created first -- out of scope for this job.
      - name: Migrate a clean database and map against it
        run: >-
          mvn -B --no-transfer-progress test
          -Dtest=ApplicationContextSmokeTest -DfailIfNoTests=false
        env:
          REVERIE_IT_DB_URL: jdbc:postgresql://localhost:5432/reverie
          REVERIE_IT_DB_USER: reverie
          REVERIE_IT_DB_PASSWORD: reverie
